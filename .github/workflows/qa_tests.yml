name: API QA Automation Tests

# 1. ¿Cuándo queremos que corran las pruebas?
on: [push] # Cada vez que alguien suba código al repositorio

# 2. ¿Qué va a hacer el servidor?
jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest # GitHub nos presta una máquina virtual con Linux

    steps:
    - name: 1. Descargar nuestro código al servidor
      uses: actions/checkout@v3

    - name: 2. Instalar Python en el servidor
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 3. Instalar PyTest y Requests
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests

    - name: 4. Ejecutar Pruebas Backend (CRUD)
      run: pytest test_crud_api.py -v